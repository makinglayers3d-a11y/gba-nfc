<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <meta name="theme-color" content="#10141b">
  <title>ML3Demuler</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

   <header class="topbar">
  <div class="brand">
  <img
    src="assets/ml3d-logo.png"
    alt="ML3D"
    class="brand-logo"
  >

  <span class="brand-name">ML3Demuler</span>

  <span id="game-title" class="game-title-hidden">
    Preparando juego…
  </span>
</div>
  <button
    id="menu-button"
    class="icon-button"
    type="button"
    aria-label="Abrir menú"
  >
    ☰
  </button>
</header>

    <section class="console">

      <div class="screen-frame">
        <canvas id="screen" width="240" height="160"></canvas>
        <div id="status">Preparando emulador…</div>
      </div>

      <section id="controls" class="controls">

        <button class="shoulder left" data-key="L">L</button>
        <button class="shoulder right" data-key="R">R</button>

        <div class="dpad">
          <button data-key="UP">▲</button>
          <button data-key="LEFT">◀</button>
          <button data-key="RIGHT">▶</button>
          <button data-key="DOWN">▼</button>
        </div>

        <div class="face-buttons">
          <button class="face b" data-key="B">B</button>
          <button class="face a" data-key="A">A</button>
        </div>

        <div class="start-select">
          <button data-key="SELECT">SELECT</button>
          <button data-key="START">START</button>
        </div>

      </section>
<div class="bottom-brand">
  <img
    src="assets/ml3d-logo.png"
    alt="ML3D"
    class="bottom-logo"
  >
  <span>ML3Demuler</span>
</div>
    </section>

    <dialog id="menu">
      <div class="menu-card">
        <button id="close-menu" type="button">×</button>
        <h2>GBA NFC</h2>
<div class="speed-control">
  <label for="speed-select">Velocidad</label>

  <select id="speed-select">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="0.9">90%</option>
    <option value="0.95" selected>95%</option>
    <option value="1">100%</option>
    <option value="1.1">110%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
  </select>
</div>
 <section class="audio-control">
  <h3>Sonido</h3>

  <div class="volume-row">
    <label for="volume-slider">Volumen</label>

    <div class="volume-controls">
      <input
        id="volume-slider"
        type="range"
        min="0"
        max="100"
        value="100"
        step="1"
      >

      <button
        id="mute-button"
        type="button"
      >
        Silenciar
      </button>
    </div>

    <span id="volume-value">100%</span>
  </div>
</section>
        
<section class="appearance-control">
  <h3>Apariencia</h3>

  <div class="color-group">
    <span>Fondo</span>
    <div class="color-options" id="background-colors">
      <button class="color-swatch" type="button" data-bg="#0b0f15" style="background:#0b0f15" aria-label="Fondo negro azulado"></button>
      <button class="color-swatch" type="button" data-bg="#111111" style="background:#111111" aria-label="Fondo negro"></button>
      <button class="color-swatch" type="button" data-bg="#263238" style="background:#263238" aria-label="Fondo gris"></button>
      <button class="color-swatch" type="button" data-bg="#123524" style="background:#123524" aria-label="Fondo verde"></button>
      <button class="color-swatch" type="button" data-bg="#2a1740" style="background:#2a1740" aria-label="Fondo morado"></button>
      <button class="color-swatch" type="button" data-bg="#401919" style="background:#401919" aria-label="Fondo rojo"></button>
    </div>
  </div>

  <div class="color-group">
    <span>Teclas</span>
    <div class="color-options" id="button-colors">
      <button class="color-swatch" type="button" data-button="#273244" style="background:#273244" aria-label="Teclas azules"></button>
      <button class="color-swatch" type="button" data-button="#3a3a3a" style="background:#3a3a3a" aria-label="Teclas grises"></button>
      <button class="color-swatch" type="button" data-button="#24543a" style="background:#24543a" aria-label="Teclas verdes"></button>
      <button class="color-swatch" type="button" data-button="#55337a" style="background:#55337a" aria-label="Teclas moradas"></button>
      <button class="color-swatch" type="button" data-button="#6a3030" style="background:#6a3030" aria-label="Teclas rojas"></button>
      <button class="color-swatch" type="button" data-button="#6a4a20" style="background:#6a4a20" aria-label="Teclas naranjas"></button>
    </div>
  </div>
</section>
<button id="fullscreen" type="button">
  Pantalla completa
</button>

<button id="reload-game" type="button">
  Reiniciar juego
</button>
       
      </div>
    </dialog>

  </main>
<script src="IodineGBA/includes/TypedArrayShim.js"></script>

<script src="IodineGBA/core/Cartridge.js"></script>
<script src="IodineGBA/core/DMA.js"></script>
<script src="IodineGBA/core/Emulator.js"></script>
<script src="IodineGBA/core/Graphics.js"></script>
<script src="IodineGBA/core/RunLoop.js"></script>
<script src="IodineGBA/core/Memory.js"></script>
<script src="IodineGBA/core/IRQ.js"></script>
<script src="IodineGBA/core/JoyPad.js"></script>
<script src="IodineGBA/core/Serial.js"></script>
<script src="IodineGBA/core/Sound.js"></script>
<script src="IodineGBA/core/Timer.js"></script>
<script src="IodineGBA/core/Wait.js"></script>
<script src="IodineGBA/core/CPU.js"></script>
<script src="IodineGBA/core/Saves.js"></script>
<script src="IodineGBA/core/SaveState.js"></script>  

<script src="IodineGBA/core/sound/FIFO.js"></script>
<script src="IodineGBA/core/sound/Channel1.js"></script>
<script src="IodineGBA/core/sound/Channel2.js"></script>
<script src="IodineGBA/core/sound/Channel3.js"></script>
<script src="IodineGBA/core/sound/Channel4.js"></script>

<script src="IodineGBA/core/CPU/ARM.js"></script>
<script src="IodineGBA/core/CPU/THUMB.js"></script>
<script src="IodineGBA/core/CPU/CPSR.js"></script>
<script src="IodineGBA/core/CPU/SWI.js"></script>  
<script src="IodineGBA/core/HLE-BIOS.js"></script>

<script src="IodineGBA/core/graphics/Renderer.js"></script>
<script src="IodineGBA/core/graphics/RendererShim.js"></script>
<script src="IodineGBA/core/graphics/RendererProxy.js"></script>
<script src="IodineGBA/core/graphics/BGTEXT.js"></script>
<script src="IodineGBA/core/graphics/BG2FrameBuffer.js"></script>
<script src="IodineGBA/core/graphics/BGMatrix.js"></script>
<script src="IodineGBA/core/graphics/AffineBG.js"></script>
<script src="IodineGBA/core/graphics/ColorEffects.js"></script>
<script src="IodineGBA/core/graphics/Mosaic.js"></script>
<script src="IodineGBA/core/graphics/OBJ.js"></script>
<script src="IodineGBA/core/graphics/OBJWindow.js"></script>
<script src="IodineGBA/core/graphics/Window.js"></script>
<script src="IodineGBA/core/graphics/Compositor.js"></script>

<script src="IodineGBA/core/memory/DMA0.js"></script>
<script src="IodineGBA/core/memory/DMA1.js"></script>
<script src="IodineGBA/core/memory/DMA2.js"></script>
<script src="IodineGBA/core/memory/DMA3.js"></script>

<script src="IodineGBA/core/cartridge/SaveDeterminer.js"></script>
<script src="IodineGBA/core/cartridge/SRAM.js"></script>
<script src="IodineGBA/core/cartridge/FLASH.js"></script>
<script src="IodineGBA/core/cartridge/EEPROM.js"></script>
<script src="IodineGBA/core/cartridge/GPIO.js"></script>
<script src="IodineGBA/core/cartridge/RTC.js"></script>

<script src="user_scripts/XAudioJS/swfobject.js"></script>
<script src="user_scripts/XAudioJS/resampler.js"></script>
<script src="user_scripts/XAudioJS/XAudioServer.js"></script>
<script src="user_scripts/AudioGlueCode.js"></script>

<script src="user_scripts/GfxGlueCode.js"></script>
<script src="app.js"></script>
  
</body>
</html>
