      <section id="controls" class="controls">

        <button class="shoulder left" data-key="L">L</button>
        <button class="shoulder right" data-key="R">R</button>

        <div class="dpad">
          <button data-key="UP">▲</button>
          <button data-key="LEFT">◀</button>
          <button data-key="RIGHT">▶</button>
          <button data-key="DOWN">▼</button>
        </div>

        <div class="face-buttons">
          <button class="face b" data-key="B">B</button>
          <button class="face a" data-key="A">A</button>
        </div>

        <div class="start-select">

<div class="bottom-brand">
  <img
    src="assets/ml3d-logo.png"
    alt="ML3D"
    class="bottom-logo"
  >
  <span>ML3Demuler</span>
</div>
    </section>

    <dialog id="menu">
      <div class="menu-card">
        <button id="close-menu" type="button">×</button>

          <img src="assets/ml3d-logo.png" alt="" style="width:28px;height:28px;object-fit:contain;">
          <span>ML3D</span>
        </h2>
        <button id="select-game-button" type="button">
  Seleccionar juego
</button>
<div class="speed-control">
  <label for="speed-select">Velocidad</label>

  <select id="speed-select">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="0.9">90%</option>
    <option value="0.95" selected>95%</option>
    <option value="1">100%</option>
    <option value="1.1">110%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
  </select>
</div>
 <section class="audio-control">
  <h3>Sonido</h3>

  <div class="volume-row">
    <div class="volume-label-row">
      <label for="volume-slider">Volumen</label>
      <span id="volume-value">100%</span>
    </div>

    <div class="volume-controls">
      <input
        id="volume-slider"
        type="range"
        min="0"
        max="100"
        value="100"
        step="1"
      >

      <button
        id="mute-button"
        type="button"

        Silenciar

    </div>
  </div>
</section>
        
<section class="appearance-control">

      <button class="color-swatch" type="button" data-bg="#123524" style="background:#123524" aria-label="Fondo verde"></button>
      <button class="color-swatch" type="button" data-bg="#2a1740" style="background:#2a1740" aria-label="Fondo morado"></button>
      <button class="color-swatch" type="button" data-bg="#401919" style="background:#401919" aria-label="Fondo rojo"></button>
    </div>
  </div>

  <div class="color-group">
    <span>Teclas</span>
    <div class="color-options" id="button-colors">
      <button class="color-swatch" type="button" data-button="#273244" style="background:#273244" aria-label="Teclas azules"></button>
      <button class="color-swatch" type="button" data-button="#3a3a3a" style="background:#3a3a3a" aria-label="Teclas grises"></button>
      <button class="color-swatch" type="button" data-button="#24543a" style="background:#24543a" aria-label="Teclas verdes"></button>

      <button class="color-swatch" type="button" data-button="#6a4a20" style="background:#6a4a20" aria-label="Teclas naranjas"></button>
    </div>
  </div>
</section>

<button id="save-game" type="button">
  Guardar partida
</button>

<button id="reload-game" type="button">
  Reiniciar juego
</button>

<button
  id="social-link"
  class="social-link"
  type="button"
  aria-label="Abrir Instagram de Makinglayers3d"
  onclick="window.open('https://www.instagram.com/makinglayers3d/', '_blank', 'noopener,noreferrer')"
>
  <span class="social-label">
    <img
      src="assets/makinglayers3d-label.png?v=1f853638"
      alt="MAKINGLAYERS3D"
      class="social-label-image"
    >
  </span>

  <span
    class="social-reflection"
    aria-hidden="true"
  ></span>
</button>
<style>
  #reload-game {
    position: relative;
    z-index: 2;
  }

  .menu-card > button#social-link {
    position: relative;
    z-index: 1;

    display: block;

    width: 100%;
    height: auto;
    margin-top: -29.5px;
    padding: 0;

    overflow: visible;

    border: 0;
    border-radius: 0;
    background: transparent;

    box-shadow: none;

    cursor: pointer;
    isolation: isolate;
    transform-origin: center;

    animation: socialDoubleClick 4s ease-in-out infinite;
  }

  .menu-card > button#social-link::before {
    content: none;
  }

  .social-label {
    position: relative;
    z-index: 1;

    display: block;
    width: 100%;
    line-height: 0;
    overflow: visible;
  }

  .social-label-image {
    display: block;

    width: 115.65%;
    max-width: none;
    height: auto;
    margin-left: -7.825%;

    object-fit: contain;
    transform: translateY(-12px);
    transform-origin: center;

    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;

    filter: none;
  }

  .social-reflection {
    position: absolute;
    top: 0;
    left: -7.825%;
    width: 115.65%;
    height: auto;
    aspect-ratio: 1774 / 887;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(
        108deg,
        transparent 0%,
        transparent 39%,
        #ffffff18 44%,
        #ffffff75 50%,
        #ffffff18 56%,
        transparent 61%,
        transparent 100%
      );
    background-size: 220% 100%;
    background-position: 130% 0;
    -webkit-mask-image: url("assets/makinglayers3d-label.png?v=1f853638");
    mask-image: url("assets/makinglayers3d-label.png?v=1f853638");
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    transform: translateY(-12px);
    transform-origin: center;
    animation: socialReflection 2.8s linear infinite;
  }

  .menu-card > button#social-link:active {
    background: transparent;
    border: 0;
  }

  .menu-card > button#social-link:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 3px;
  }

  @keyframes socialReflection {
    0% {
      background-position: 130% 0;
    }

    100% {
      background-position: -120% 0;
    }
  }

  @keyframes socialDoubleClick {
    0%, 70%, 76%, 82%, 88%, 100% {
      transform: scale(1);
      filter: brightness(1);
    }
    73%, 85% {
      transform: scale(0.975);
      filter: brightness(1.12);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .menu-card > button#social-link,
    .social-reflection {
      animation: none;
    }
    .social-reflection {
      display: none;
    }
  }
</style>
       
      </div>
