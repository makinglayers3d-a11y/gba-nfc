<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Prueba GB / GBC</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      min-height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px;
      box-sizing: border-box;
    }

    #game {
      width: min(90vw, 640px);
    }

    #mainCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #controller {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Prueba GB / GBC</h1>

  <div id="game">

    <canvas
      id="mainCanvas"
      width="160"
      height="144"
    >
      No Canvas Support
    </canvas>

  </div>

  <!--
    Elementos que espera simple.js.
    Los ocultamos de momento.
  -->
  <div id="controller">

    <div id="controller_dpad">
      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>
    </div>

    <div id="controller_select">
      Select
    </div>

    <div id="controller_start">
      Start
    </div>

    <div id="controller_b">
      B
    </div>

    <div id="controller_a">
      A
    </div>

  </div>

  <div id="status">
    Cargando emulador…
  </div>

  <script src="GB/binjgb.js"></script>
  <script src="GB/simple.js"></script>

</body>

</html>
